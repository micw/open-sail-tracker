[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "open-sail-tracker-backend"
version = "0.2.0"
description = "CoAP telemetry ingest for Open Sail Tracker"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
open-sail-tracker-backend = "open_sail_tracker_backend.server:main"

[tool.setuptools.packages.find]
where = ["src"]
