[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "open-sail-tracker-backend"
version = "0.4.0"
description = "CoAP telemetry ingest and HTTP event API for Open Sail Tracker"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
open-sail-tracker-backend = "open_sail_tracker_backend.server:main"
open-sail-tracker-api = "open_sail_tracker_backend.web_api:main"

[tool.setuptools.packages.find]
where = ["src"]
