{{- if .Values.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "open-sail-tracker.fullname" . }}
  labels:
    {{- include "open-sail-tracker.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- with .Values.service.externalIPs }}
  externalIPs:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- if and (eq .Values.service.type "LoadBalancer") .Values.service.externalTrafficPolicy }}
  externalTrafficPolicy: {{ .Values.service.externalTrafficPolicy }}
  {{- end }}
  selector:
    {{- include "open-sail-tracker.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  ports:
    - name: coap
      port: {{ .Values.service.port }}
      targetPort: coap
      protocol: UDP
{{- end }}
